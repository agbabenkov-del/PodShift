name: Feature request
description: Suggest an improvement or new capability for PodShift.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep requests focused on making AirPods switching on Windows simpler, faster, or more reliable.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the current friction before describing the feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain what you would like PodShift to do.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention workarounds or other approaches you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, or hardware details can help.
