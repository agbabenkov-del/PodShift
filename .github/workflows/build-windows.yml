name: Build PodShift for Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PodShift.csproj

      - name: Publish PodShift
        run: >
          dotnet publish PodShift.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Verify skins and layout
        shell: pwsh
        run: ./.github/scripts/verify-ui.ps1 -OutputPath ./ui-preview

      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PodShift-ui-preview
          path: ui-preview/*.png
          if-no-files-found: warn

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PodShift-win-x64
          path: publish/*
